version: "3.9"

services:
  neuronlm-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEURONLM_ENVIRONMENT=development
      - NEURONLM_DEBUG=true
      - NEURONLM_DATABASE_URL=postgresql+asyncpg://neuronlm:neuronlm@postgres:5432/neuronlm
      - NEURONLM_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neuronlm
      POSTGRES_PASSWORD: neuronlm
      POSTGRES_DB: neuronlm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronlm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
